name: Prepare desktop draft for local signing
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit (40 hex characters)
        required: true
      version:
        description: Qualified Stable or numbered Beta desktop version
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-publish
  cancel-in-progress: false
jobs:
  prepare-draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create an empty unpublished draft only
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          source=os.environ['SOURCE_SHA'];version=os.environ['DESKTOP_VERSION']
          assert re.fullmatch('[a-f0-9]{40}',source)
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-beta\.[1-9]\d*|\+community\.[1-9]\d*)?',version)
          repo='TTokomon/SumidokuApp';tag='desktop-v'+version
          policy=json.loads(Path('.github/desktop-release/policy.json').read_text())
          entry=policy['approvedReleases'].get(version)
          if policy['repository'] != repo or not entry or entry['sourceRevision'] != source:
              raise SystemExit('Draft version and source must match main’s reviewed release policy')
          if not os.environ.get('GH_TOKEN'):
              raise SystemExit('Set DESKTOP_RELEASE_TOKEN in the protected desktop-release environment')
          subprocess.run(['gh','api',f'repos/{repo}/commits/{source}'],check=True,stdout=subprocess.DEVNULL)
          existing=subprocess.check_output(['gh','api',f'repos/{repo}/releases','--paginate','--jq','.[] | .tag_name'],text=True)
          if tag in existing.splitlines():
              raise SystemExit('Existing releases and drafts are preserved')
          refs=subprocess.check_output(['gh','api',f'repos/{repo}/git/matching-refs/tags/{tag}','--jq','.[] | .ref'],text=True)
          if f'refs/tags/{tag}' in refs.splitlines():
              raise SystemExit('An existing tag cannot be reused for draft creation')
          subprocess.run(['gh','release','create',tag,'--repo',repo,'--target',source,'--draft','--title','Sumidoku Desktop '+version,'--notes','Unpublished draft awaiting locally signed artifacts and complete exact-artifact qualification. No application is available for installation.']+(['--prerelease'] if '-beta.' in version else []),check=True)
          PY
