name: Publish qualified desktop community release
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate only; never create, upload or publish releases
        type: boolean
        default: true
      policy_test:
        description: Non-publishing trust-boundary self-test without draft assets
        type: boolean
        default: false
      version:
        description: Reviewed desktop version
        required: true
        default: 1.3.0+community.1
      staged_tag:
        description: Matching unpublished draft containing locally signed artifacts
        required: false
      candidate_run_id:
        description: Alternative successful reviewed candidate run
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.verify_only && 'desktop-verify' || 'desktop-publish' }}
  cancel-in-progress: false
jobs:
  policy-test:
    if: inputs.policy_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a non-publishing test
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: test "$VERIFY_ONLY" = true
      - name: Fetch only the immutable reviewed verifier objects
        run: |
          revision=$(python3 -c 'import json; print(json.load(open(".github/desktop-release/policy.json"))["toolingCommit"])')
          git fetch --no-tags --depth=1 origin "$revision"
      - name: Check permissions, guards and reviewed verifier source closure
        run: |
          python3 -m unittest discover -s .github/desktop-release/tests -v
          python3 - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'.github/desktop-release')
          import validate
          with tempfile.TemporaryDirectory() as directory:
              validate.materialize(Path('.'),Path(directory))
          print('PASS: immutable reviewed verifier source hashes; no compilation or publication needed for policy test')
          PY
  validate:
    if: inputs.policy_test == false
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.verified.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch only the immutable reviewed verifier objects
        run: |
          revision=$(python3 -c 'import json; print(json.load(open(".github/desktop-release/policy.json"))["toolingCommit"])')
          git fetch --no-tags --depth=1 origin "$revision"
      - name: Authenticate artifacts with read-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ inputs.version }}
          STAGED_TAG: ${{ inputs.staged_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python3 .github/desktop-release/validate.py --repo . --version "$DESKTOP_VERSION" --staged-tag "$STAGED_TAG" --candidate-run-id "$CANDIDATE_RUN_ID" --output "$RUNNER_TEMP/desktop-verified"
      - name: Preserve exactly the authenticated public files
        id: verified
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-verified
          path: ${{ runner.temp }}/desktop-verified/
          retention-days: 7
  publish:
    if: inputs.policy_test == false && inputs.verify_only == false && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's immutable verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'.github/desktop-release')
          import common
          identifier=os.environ['ARTIFACT_ID'];assert identifier.isdigit()
          metadata=common.gh_json('api',f'repos/{common.REPO}/actions/artifacts/{identifier}')
          assert str(metadata['workflow_run']['id'])==os.environ['GITHUB_RUN_ID'] and metadata['name']=='desktop-verified' and not metadata['expired']
          root=Path(os.environ['RUNNER_TEMP']);package=root/'verified.zip'
          common.download_stream(f'repos/{common.REPO}/actions/artifacts/{identifier}/zip',package,536870912)
          # verified.json is main-owned data, not executable input.
          import zipfile,stat
          output=root/'desktop-publish';output.mkdir()
          allowed={n:l for version in common.policy()['approvedReleases'] for n,l in common.filenames(version).items()};allowed['verified.json']=65536
          with zipfile.ZipFile(package) as archive:
              seen=set()
              for entry in archive.infolist():
                  assert entry.filename in allowed and entry.filename not in seen and not entry.is_dir() and not stat.S_ISLNK(entry.external_attr>>16) and 0<entry.file_size<=allowed[entry.filename]
                  seen.add(entry.filename)
                  with archive.open(entry) as source,(output/entry.filename).open('xb') as target:
                      count=0
                      while data:=source.read(65536):
                          count+=len(data);assert count<=allowed[entry.filename];target.write(data)
          PY
      - name: Publish using main-owned code only after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/desktop-release/publish.py "$RUNNER_TEMP/desktop-publish" --execute
