name: Publish qualified desktop community release
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Validate only; never create, upload or publish releases
        type: boolean
        default: true
      policy_test:
        description: Non-publishing trust-boundary self-test without draft assets
        type: boolean
        default: false
      version:
        description: Reviewed desktop version
        required: true
        default: 1.3.0+community.1
      staged_tag:
        description: Matching unpublished draft containing locally signed artifacts
        required: false
      candidate_run_id:
        description: Alternative successful reviewed candidate run
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.verify_only && 'desktop-verify' || 'desktop-publish' }}
  cancel-in-progress: false
jobs:
  policy-test:
    if: inputs.policy_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require a non-publishing test
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: test "$VERIFY_ONLY" = true
      - name: Fetch only the immutable reviewed verifier objects
        run: |
          revision=$(python3 -c 'import json; print(json.load(open(".github/desktop-release/policy.json"))["toolingCommit"])')
          git fetch --no-tags --depth=1 origin "$revision"
      - name: Check permissions, guards and reviewed verifier source closure
        run: |
          python3 -m unittest discover -s .github/desktop-release/tests -v
          python3 - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'.github/desktop-release')
          import validate
          with tempfile.TemporaryDirectory() as directory:
              validate.materialize(Path('.'),Path(directory))
          print('PASS: immutable reviewed verifier source hashes; no compilation or publication needed for policy test')
          PY
  validate:
    if: inputs.policy_test == false
    # ARM64 hosted capacity can abandon a job before it receives a runner.
    # The native verifier checks ARM64 Mach-O/signatures without executing it.
    runs-on: macos-26-intel
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.verified.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch only the immutable reviewed verifier objects
        run: |
          revision=$(python3 -c 'import json; print(json.load(open(".github/desktop-release/policy.json"))["toolingCommit"])')
          git fetch --no-tags --depth=1 origin "$revision"
      - name: Authenticate artifacts with read-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ inputs.version }}
          STAGED_TAG: ${{ inputs.staged_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          # Short-lived, asset-read-only URLs; never a repository or signing key.
          SUMIDOKU_DRAFT_TRANSPORT: ${{ secrets.DESKTOP_DRAFT_TRANSPORT }}
        run: |
          python3 .github/desktop-release/validate.py --repo . --version "$DESKTOP_VERSION" --staged-tag "$STAGED_TAG" --candidate-run-id "$CANDIDATE_RUN_ID" --output "$RUNNER_TEMP/desktop-verified"
      - name: Upload the verification receipt only
        id: verified
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-verification-receipt
          path: ${{ runner.temp }}/desktop-verified/verified.json
          if-no-files-found: error
          # Preserve the exact authenticated receipt for approved-job recovery.
          retention-days: 90
  publish:
    if: inputs.policy_test == false && inputs.verify_only == false && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: macos-26-intel
    environment: desktop-release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only this run's immutable verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/desktop-release/publish.py --fetch-receipt "$ARTIFACT_ID" --receipt "$RUNNER_TEMP/verified.json"
      - name: Compile the pinned native verifier without the release credential
        run: |
          revision=$(python3 -c 'import json; print(json.load(open(".github/desktop-release/policy.json"))["toolingCommit"])')
          git fetch --no-tags --depth=1 origin "$revision"
          python3 .github/desktop-release/validate.py --repo . --prepare-tool "$RUNNER_TEMP/desktop-tool"
      - name: Publish using main-owned code only after environment approval
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set DESKTOP_RELEASE_TOKEN in the protected desktop-release environment."
            exit 1
          fi
          python3 .github/desktop-release/publish.py --execute "$RUNNER_TEMP/desktop-tool" --receipt "$RUNNER_TEMP/verified.json"
